<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Chat</title>

    <link rel="stylesheet" href="/css/personalChat.css">

</head>

<body>

    <div class="chat-container">

        <!-- Header -->

        <div class="chat-header">

            <div class="profile">

                <div class="avatar">
                    P
                </div>

                <div class="header-text">

                    <h2 id="chatTitle">Personal Chat</h2>

                    <p id="chatStatus">
                        Start a conversation
                    </p>

                </div>

            </div>

        </div>


        <!-- Search User -->

        <div class="personal-chat">

            <input
                type="email"
                id="userEmail"
                placeholder="Enter user's email"
            >

            <button id="joinRoomBtn">
                Start Chat
            </button>

        </div>


        <!-- Messages -->

        <div id="messages" class="messages">
        </div>


        <!-- Message Input -->

        <div class="chat-input">

            <input
                type="text"
                id="message"
                placeholder="Type a message..."
            >

            <button id="sendBtn">
                Send
            </button>

        </div>

    </div>


    <script src="/socket.io/socket.io.js"></script>

    <script src="/js/personalChat.js"></script>

</body>

</html>
