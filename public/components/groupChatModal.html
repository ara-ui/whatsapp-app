<div
    id="createGroupModal"
    class="modal-overlay hidden">

    <div class="modal">

        <h3>
            Create a group
        </h3>

        <input
            type="text"
            id="groupNameInput"
            placeholder="Group name">

        <p class="modal-hint">
            Member emails, comma-separated
        </p>

        <input
            type="text"
            id="groupMembersInput"
            placeholder="a@example.com, b@example.com">

        <div class="modal-actions">

            <button
                id="createGroupCancelBtn"
                class="btn-secondary">
                Cancel
            </button>

            <button
                id="createGroupSubmitBtn"
                class="btn-primary">
                Create Group
            </button>

        </div>

    </div>

</div>
