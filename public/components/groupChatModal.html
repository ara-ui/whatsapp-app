<div id="createGroupModal" class="modal-overlay hidden">
    <div class="modal space-modal">
        <div class="space-modal-header">
            <div>
                <h3>Create a Space</h3>
                <p class="modal-hint">Create a focused room and invite people. They join only after accepting.</p>
            </div>
            <button type="button" id="createGroupCancelBtn" class="modal-close-btn" aria-label="Close">×</button>
        </div>

        <input type="text" id="groupNameInput" placeholder="Space name (e.g. Project Team)">
        <input type="text" id="groupPurposeInput" placeholder="Purpose (e.g. College project discussion)">

        <div class="space-section">
            <h4>Invite from your connections</h4>
            <div id="spaceConnectedMembers" class="space-member-picker">
                <div class="empty-state">Loading connections…</div>
            </div>
        </div>

        <div class="space-section">
            <h4>Or invite by email</h4>
            <p class="modal-hint">Enter one or more registered email addresses, separated by commas.</p>
            <input type="text" id="groupMembersInput" placeholder="a@example.com, b@example.com">
        </div>

        <div id="spaceCreateFeedback" class="connection-feedback hidden"></div>

        <div class="modal-actions">
            <button type="button" id="createGroupCancelBtnSecondary" class="btn-secondary">Cancel</button>
            <button type="button" id="createGroupSubmitBtn" class="btn-primary">Create Space &amp; Invite</button>
        </div>
    </div>
</div>
