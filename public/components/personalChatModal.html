<div class="modal-overlay hidden" id="startChatModal">

    <div class="modal">

        <h3>Start a personal chat</h3>

        <p class="modal-hint">
            Enter the exact email of a registered user
        </p>

        <input
            type="email"
            id="startChatEmailInput"
            placeholder="user@example.com"
        >

        <div class="modal-actions">

            <button
                id="startChatCancelBtn"
                class="btn-secondary">
                Cancel
            </button>

            <button
                id="startChatSubmitBtn"
                class="btn-primary">
                Start Chat
            </button>

        </div>

    </div>

</div>
