<div class="sidebar-topbar">

    <h1 class="app-title">Connectly</h1>

    <div class="topbar-actions">

        <button
            id="newGroupBtn"
            class="icon-btn"
            title="Create a Space"
            aria-label="Create a Space">
            ➕
        </button>

        <button
            id="newChatBtn"
            class="icon-btn connection-icon-btn"
            title="Connections & invitations"
            aria-label="Connections & invitations">
            👤
            <span id="connectionRequestBadge" class="connection-request-badge hidden">0</span>
        </button>

        <div class="menu-wrapper">

            <button
                id="menuBtn"
                class="icon-btn"
                title="Menu">
                ⋮
            </button>

            <div
                id="menuDropdown"
                class="menu-dropdown hidden">

                <button
                    id="logoutBtn"
                    class="menu-item">
                    Logout
                </button>

            </div>

        </div>

    </div>

    <div id="connectionToastContainer" class="connection-toast-container" aria-live="polite" aria-atomic="true"></div>

</div>
