<div class="input-row">

    <button
        id="attachBtn"
        class="icon-btn attach-btn"
        title="Attach media">
        📎
    </button>

    <input
        type="file"
        id="mediaFileInput"
        accept="image/jpeg,image/png,image/webp,image/gif,video/mp4,video/webm,video/quicktime,application/pdf"
        hidden
    >

    <input
        type="text"
        id="messageInput"
        placeholder="Type a message..."
    >

    <button id="sendBtn">
        Send
    </button>

</div>
