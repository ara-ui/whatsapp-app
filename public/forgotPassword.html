<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Forgot Password</title>

    <link
        rel="stylesheet"
        href="/css/forgotPassword.css">

</head>

<body>

    <div class="container">

        <h1>Forgot Password?</h1>

        <p>
            Enter your registered email address and
            we'll send you a password reset link.
        </p>

        <form id="forgotForm">

            <input
                type="email"
                id="email"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button
                type="submit"
                id="sendResetButton">
                Send Email
            </button>

        </form>

        <p
            id="forgotPasswordMessage"
            class="form-message"
            aria-live="polite">
        </p>

        <a
            href="/login.html"
            class="back-login">
            ← Back to Login
        </a>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
    </script>

    <script src="/js/forgotPassword.js"></script>

</body>

</html>
