<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Connectly</title>

    <link
        rel="stylesheet"
        href="/css/home.css">

    <link rel="stylesheet" href="/css/chat-window-core.css">
    <link rel="stylesheet" href="/css/media-messages.css">
    <link rel="stylesheet" href="/css/attachment-preview.css">
    <link rel="stylesheet" href="/css/media-viewer.css">
    <link rel="stylesheet" href="/css/message-status.css">
    <link rel="stylesheet" href="/css/ai-smart-replies.css">
    <link rel="stylesheet" href="/css/chat-layout.css">
    <link rel="stylesheet" href="/css/chat-actions.css">
    <link rel="stylesheet" href="/css/space-info.css">
    <link rel="stylesheet" href="/css/message-reply.css">

    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
    </script>

</head>

<body>

    <div class="app-container">

        <!-- ================= SIDEBAR ================= -->

        <div class="sidebar">

            <div id="sidebarHeader"></div>

            <div id="chatListSection"></div>

        </div>


        <!-- ================= CHAT WINDOW ================= -->

        <div
            id="chatWindowPanel"
            class="chat-window-panel">

            <div
                id="chatWindowEmptyState"
                class="chat-window-empty">

                <p>
                    Select a chat to start messaging
                </p>

            </div>


            <div
                id="chatWindowActive"
                class="chat-window-active hidden">

                <!-- Header -->
                <div id="chatWindowHeader"></div>

                <!-- Messages -->
                <div id="messagesContainer"></div>

                <!-- Input area -->

                <div class="chat-input">

                    <div id="aiSuggestions"></div>

                    <div id="chatInput"></div>

                </div>

            </div>

        </div>

    </div>


    

    <div id="groupChatModal"></div>
    <div id="connectionModalContainer"></div>




    <script src="/socket.io/socket.io.js"></script>


    <script src="/js/componentsLoader.js"></script>

</body>

</html>
