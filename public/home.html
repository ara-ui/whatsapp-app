<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ChatApp</title>

    <link
        rel="stylesheet"
        href="/css/home.css">

    <link
        rel="stylesheet"
        href="/css/chatWindow.css">

    <script
        src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js">
    </script>

</head>

<body>

    <div class="app-container">

        <!-- ================= SIDEBAR ================= -->

        <div class="sidebar">

            <div id="sidebarHeader"></div>

            <div id="chatListSection"></div>

        </div>


        <!-- ================= CHAT WINDOW ================= -->

        <div
            id="chatWindowPanel"
            class="chat-window-panel">

            <div
                id="chatWindowEmptyState"
                class="chat-window-empty">

                <p>
                    Select a chat to start messaging
                </p>

            </div>


            <div
                id="chatWindowActive"
                class="chat-window-active hidden">

                <!-- Header -->
                <div id="chatWindowHeader"></div>

                <!-- Messages -->
                <div id="messagesContainer"></div>

                <!-- Input area -->

                <div class="chat-input">

                    <div id="aiSuggestions"></div>

                    <div id="chatInput"></div>

                </div>

            </div>

        </div>

    </div>


    <!-- ================= MODALS ================= -->

    <div id="personalChatModal"></div>

    <div id="groupChatModal"></div>


    <!-- Socket.IO -->

    <script src="/socket.io/socket.io.js"></script>

    <!-- Component loader MUST run first -->

    <script src="/js/componentsLoader.js"></script>

</body>

</html>
